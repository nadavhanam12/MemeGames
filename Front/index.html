<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>HORMUZ HOLD'EM</title>
    <style>
      @font-face {
        font-family: 'Anton';
        src: url('/assets/fonts/Anton.woff2') format('woff2');
        font-weight: 400;
        font-display: block;
      }
      @font-face {
        font-family: 'Chakra Petch';
        src: url('/assets/fonts/ChakraPetch-SemiBold.woff2') format('woff2');
        font-weight: 600;
        font-display: block;
      }
      html, body {
        margin: 0;
        padding: 0;
        background: #000;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #app-shell {
        width: 100%;
        height: 100%;
        height: 100dvh;
        display: flex;
        align-items: stretch;
        justify-content: center;
      }
      #game {
        flex: 1 1 auto;
        min-width: 0;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas { display: block; }

      /* Desktop-only flanking panels — hidden by default (mobile/narrow),
         shown once the window is wide enough that they don't crowd the
         portrait canvas. Left = functional meme-collection grid, right =
         preview of whichever meme was last clicked (ambient backdrop +
         new-unlock toast when nothing is selected). */
      .side-panel { display: none; height: 100%; box-sizing: border-box; position: relative; overflow: hidden; min-width: 0; }
      @media (min-width: 1180px) {
        /* #game no longer eats all leftover width — it's sized to exactly
           what the portrait canvas needs (height-driven, 9:16), so the two
           panels can grow to actually meet its edges instead of leaving a
           dead black gap between the canvas and the cards. */
        #game { flex: 0 0 auto; width: auto; aspect-ratio: 720 / 1280; }
        .side-panel { display: block; flex: 1 1 0; }
        #side-left { max-width: 460px; }
        #side-right { max-width: 400px; }
      }

      .side-backdrop {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(160deg, #0c1620 0%, #0e2a3a 45%, #123044 100%),
          repeating-linear-gradient(-35deg, rgba(255, 243, 214, 0.05) 0px, rgba(255, 243, 214, 0.05) 2px, transparent 2px, transparent 64px);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .side-backdrop::before {
        content: '';
        position: absolute;
        inset: -20%;
        background:
          radial-gradient(circle at 25% 20%, rgba(135, 202, 167, 0.22), transparent 45%),
          radial-gradient(circle at 75% 80%, rgba(244, 185, 66, 0.20), transparent 45%);
      }
      .side-backdrop-mark {
        position: relative;
        transform: rotate(-90deg);
        font-family: 'Anton', 'Arial Black', Impact, sans-serif;
        font-size: 46px;
        letter-spacing: 4px;
        color: rgba(255, 243, 214, 0.14);
        white-space: nowrap;
        -webkit-text-stroke: 1px rgba(255, 243, 214, 0.1);
      }
      .side-toast {
        position: absolute;
        left: 16px;
        right: 16px;
        bottom: 28px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        background: rgba(23, 32, 42, 0.95);
        border: 2px solid #F4B942;
        border-radius: 12px;
        opacity: 0;
        transform: translateY(12px);
        pointer-events: none;
      }
      .side-toast.show {
        animation: side-toast-in-out 2.6s ease forwards;
      }
      .side-toast img { width: 40px; height: 40px; object-fit: cover; border-radius: 6px; flex: none; }
      .side-toast-text {
        font-family: 'Chakra Petch', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        color: #FFF3D6;
      }
      @keyframes side-toast-in-out {
        0% { opacity: 0; transform: translateY(12px); }
        10% { opacity: 1; transform: translateY(0); }
        85% { opacity: 1; transform: translateY(0); }
        100% { opacity: 0; transform: translateY(12px); }
      }

      .gallery-card {
        position: absolute;
        inset: 24px 20px;
        background: rgba(23, 32, 42, 0.9);
        border: 2px solid #2f3336;
        border-radius: 16px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .gallery-card-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        padding: 14px 16px 10px;
        border-bottom: 2px solid #2f3336;
        flex: none;
      }
      .gallery-card-title {
        font-family: 'Anton', 'Arial Black', Impact, sans-serif;
        font-size: 15px;
        letter-spacing: 0.5px;
        color: #F4B942;
      }
      .gallery-card-count {
        font-family: 'Chakra Petch', 'Helvetica Neue', Arial, sans-serif;
        font-size: 12px;
        color: #71767B;
      }
      .gallery-card-grid {
        flex: 1 1 auto;
        overflow-y: auto;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 88px 10px;
        padding: 14px;
      }
      .gallery-tile {
        position: relative;
        aspect-ratio: 1 / 1;
        border-radius: 8px;
        overflow: hidden;
        background: #0e161e;
        border: 2px solid #39424e;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .gallery-tile.unlocked { border-color: #F4B942; cursor: pointer; }
      .gallery-tile.selected { border-color: #9B5DE5; box-shadow: 0 0 0 2px rgba(155, 93, 229, 0.6); }
      .gallery-tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .gallery-tile.locked img { filter: grayscale(1) brightness(0.4); }
      .gallery-tile-label {
        font-family: 'Chakra Petch', 'Helvetica Neue', Arial, sans-serif;
        font-size: 9px;
        color: #71767B;
        text-align: center;
        padding: 4px;
      }
      .gallery-tile-badge {
        position: absolute;
        top: 3px;
        right: 3px;
        background: #35D07F;
        color: #17202A;
        font-family: 'Chakra Petch', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 700;
        font-size: 8px;
        letter-spacing: 0.5px;
        padding: 2px 4px;
        border-radius: 4px;
        opacity: 0;
      }
      .gallery-tile-new .gallery-tile-badge { opacity: 1; }
      .gallery-tile-new { animation: gallery-tile-glow 2.6s ease; }
      @keyframes gallery-tile-glow {
        0% { box-shadow: 0 0 0 0 rgba(244, 185, 66, 0.9); }
        30% { box-shadow: 0 0 0 6px rgba(244, 185, 66, 0.35); }
        100% { box-shadow: 0 0 0 0 rgba(244, 185, 66, 0); }
      }

      .preview-hint {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        text-align: center;
        padding: 0 24px;
        pointer-events: none;
      }
      .preview-hint-title {
        font-family: 'Anton', 'Arial Black', Impact, sans-serif;
        font-size: 15px;
        letter-spacing: 0.5px;
        color: rgba(255, 243, 214, 0.55);
      }
      .preview-hint-sub {
        font-family: 'Chakra Petch', 'Helvetica Neue', Arial, sans-serif;
        font-size: 12px;
        color: rgba(255, 243, 214, 0.35);
      }
      .preview-card {
        position: absolute;
        inset: 24px 20px;
        background: rgba(23, 32, 42, 0.96);
        border: 2px solid #2f3336;
        border-radius: 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 20px 16px;
        overflow-y: auto;
      }
      .preview-close {
        position: absolute;
        top: 10px;
        right: 10px;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 2px solid #39424e;
        background: rgba(0, 0, 0, 0.4);
        color: #FFF3D6;
        font-family: 'Chakra Petch', 'Helvetica Neue', Arial, sans-serif;
        font-size: 14px;
        line-height: 1;
        cursor: pointer;
      }
      .preview-img {
        max-width: 100%;
        max-height: 42vh;
        border-radius: 8px;
        border: 4px solid #F4B942;
        flex: none;
      }
      .preview-fallback {
        width: 100%;
        aspect-ratio: 1 / 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #2a323b;
        color: #9aa4ad;
        font-family: 'Chakra Petch', 'Helvetica Neue', Arial, sans-serif;
        border-radius: 8px;
        flex: none;
      }
      .preview-share-title {
        font-family: 'Chakra Petch', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 0.5px;
        color: #AAB4BD;
      }
      .preview-share-row {
        display: flex;
        gap: 14px;
      }
      .preview-share-btn {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: none;
        padding: 0;
        cursor: pointer;
        background: transparent;
      }
      .preview-share-btn img { width: 100%; height: 100%; border-radius: 50%; display: block; }
      .preview-download {
        font-family: 'Anton', 'Arial Black', Impact, sans-serif;
        font-size: 15px;
        color: #17202A;
        background: #35D07F;
        border: 3px solid #17202A;
        border-radius: 8px;
        padding: 10px 24px;
        cursor: pointer;
      }

      /* Strategic dashboard design language. These rules intentionally sit
         after the legacy feed styles so every desktop surface inherits the
         same near-black panel, hairline border and restrained accent system. */
      :root {
        --dash-bg: #05090d;
        --dash-panel: rgba(14, 22, 29, 0.96);
        --dash-panel-2: rgba(10, 17, 23, 0.98);
        --dash-border: #24313b;
        --dash-border-soft: rgba(88, 108, 122, 0.22);
        --dash-text: #f2f2ee;
        --dash-muted: #89939d;
        --dash-gold: #f4b942;
        --dash-green: #54df93;
        --dash-purple: #a46de1;
      }
      body {
        background:
          radial-gradient(circle at 50% -20%, rgba(37, 78, 94, 0.18), transparent 42%),
          linear-gradient(180deg, #060a0e 0%, #020406 100%);
      }
      #app-shell { box-sizing: border-box; }
      @media (min-width: 1180px) {
        #app-shell {
          max-width: 1720px;
          margin: 0 auto;
          padding: 16px;
          gap: 16px;
        }
        #game {
          height: 100%;
          border: 1px solid var(--dash-border);
          border-radius: 16px;
          overflow: hidden;
          background: #071018;
          box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45), inset 0 1px rgba(255, 255, 255, 0.03);
        }
        #game canvas { border-radius: 15px; }
        #side-left { flex-basis: 380px; max-width: 430px; }
        #side-right { flex-basis: 340px; max-width: 390px; }
        .side-panel {
          height: 100%;
          animation: dash-panel-enter 480ms cubic-bezier(.2,.75,.25,1) both;
        }
        #side-left { animation-delay: 60ms; }
        #side-right { animation-delay: 120ms; }
      }
      @keyframes dash-panel-enter {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .gallery-card,
      .preview-card {
        inset: 0;
        border: 1px solid var(--dash-border);
        border-radius: 16px;
        background:
          linear-gradient(180deg, rgba(19, 29, 37, 0.96), rgba(9, 15, 20, 0.98)),
          var(--dash-panel);
        box-shadow: inset 0 1px rgba(255, 255, 255, 0.025), 0 24px 70px rgba(0, 0, 0, 0.28);
      }
      .gallery-card-header {
        align-items: center;
        padding: 22px 20px 16px;
        border-bottom: 1px solid var(--dash-border-soft);
      }
      .gallery-card-title {
        color: var(--dash-text);
        font-family: 'Chakra Petch', 'Helvetica Neue', Arial, sans-serif;
        font-size: 17px;
        letter-spacing: 1.2px;
        text-transform: uppercase;
      }
      .gallery-card-count { color: var(--dash-gold); font-size: 13px; }
      .gallery-card-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 20px 0;
        color: var(--dash-muted);
        font: 600 10px 'Chakra Petch', sans-serif;
        letter-spacing: .8px;
        text-transform: uppercase;
      }
      .gallery-search-row { display: flex; gap: 8px; padding: 14px 20px 12px; }
      .gallery-search {
        flex: 1;
        min-width: 0;
        height: 40px;
        box-sizing: border-box;
        border: 1px solid var(--dash-border);
        border-radius: 8px;
        outline: none;
        background: rgba(5, 10, 14, 0.7);
        color: var(--dash-text);
        padding: 0 12px;
        font: 600 12px 'Chakra Petch', sans-serif;
      }
      .gallery-search:focus { border-color: var(--dash-gold); box-shadow: 0 0 0 2px rgba(244, 185, 66, .16); }
      .gallery-filter {
        height: 40px;
        padding: 0 12px;
        border: 1px solid var(--dash-border);
        border-radius: 8px;
        background: rgba(5, 10, 14, 0.7);
        color: var(--dash-text);
        font: 600 11px 'Chakra Petch', sans-serif;
        cursor: pointer;
      }
      .gallery-card-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        grid-auto-rows: clamp(64px, 5.4vw, 92px);
        align-content: start;
        align-items: stretch;
        gap: 8px;
        padding: 4px 20px 20px;
        scrollbar-width: thin;
        scrollbar-color: #35434d transparent;
      }
      .gallery-tile {
        appearance: none;
        display: block;
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        padding: 0;
        border: 1px solid #33414b;
        border-radius: 8px;
        transition: transform 140ms ease, border-color 140ms ease, box-shadow 140ms ease, filter 140ms ease;
      }
      .gallery-tile img { position: absolute; inset: 0; }
      .gallery-tile.unlocked { border-color: #66727a; }
      .gallery-tile.unlocked:hover {
        z-index: 2;
        transform: translateY(-2px) scale(1.025);
        border-color: var(--dash-gold);
        box-shadow: 0 8px 24px rgba(0, 0, 0, .35), 0 0 0 1px rgba(244, 185, 66, .16);
      }
      .gallery-tile.selected { border-color: var(--dash-gold); box-shadow: 0 0 0 2px rgba(244, 185, 66, 0.3); }
      .gallery-tile.locked img { filter: grayscale(1) brightness(0.33) contrast(.9); }
      .side-backdrop {
        border: 1px solid var(--dash-border);
        border-radius: 16px;
        background:
          linear-gradient(180deg, rgba(17, 27, 34, .96), rgba(7, 12, 17, .98)),
          repeating-linear-gradient(0deg, transparent 0 47px, rgba(104, 138, 154, .06) 48px),
          repeating-linear-gradient(90deg, transparent 0 47px, rgba(104, 138, 154, .06) 48px);
      }
      .side-backdrop::before {
        inset: 0;
        background:
          radial-gradient(circle at 70% 22%, rgba(244, 185, 66, 0.09), transparent 42%),
          radial-gradient(circle at 20% 82%, rgba(26, 155, 197, 0.08), transparent 38%);
      }
      .side-backdrop-mark { display: none; }
      .preview-hint {
        inset: 24px;
        justify-content: flex-start;
        align-items: stretch;
        gap: 0;
        padding: 0;
        text-align: left;
      }
      .preview-hint::before {
        content: 'MEME PREVIEW';
        padding-bottom: 18px;
        border-bottom: 1px solid var(--dash-border-soft);
        color: var(--dash-text);
        font: 600 17px 'Chakra Petch', sans-serif;
        letter-spacing: 1px;
      }
      .preview-hint-title {
        display: block;
        min-height: 320px;
        margin-top: 20px;
        border: 1px dashed #33414b;
        border-radius: 12px;
        color: transparent;
        background:
          radial-gradient(circle at 50% 48%, rgba(244, 185, 66, .08), transparent 38%),
          linear-gradient(135deg, rgba(255,255,255,.02), transparent);
      }
      .preview-hint-sub { margin-top: 18px; color: var(--dash-muted); font-size: 12px; text-align: center; }
      .preview-card { gap: 16px; padding: 24px 20px; }
      .preview-card-heading {
        width: 100%;
        box-sizing: border-box;
        padding: 0 48px 16px 0;
        border-bottom: 1px solid var(--dash-border-soft);
        display: grid;
        gap: 6px;
        color: var(--dash-text);
        font-family: 'Chakra Petch', sans-serif;
      }
      .preview-card-eyebrow { color: var(--dash-muted); font-size: 10px; letter-spacing: 1px; }
      .preview-card-heading strong { font-size: 16px; letter-spacing: .4px; text-transform: uppercase; }
      .preview-card-rarity { color: var(--dash-purple); font-size: 10px; letter-spacing: .8px; }
      .preview-img { border: 1px solid var(--dash-gold); border-radius: 10px; }
      .preview-close {
        width: 40px; height: 40px; border: 1px solid var(--dash-border); border-radius: 8px;
        background: rgba(5, 10, 14, .88); color: var(--dash-text);
      }
      .preview-close:hover { border-color: var(--dash-gold); }
      .preview-download {
        min-height: 44px;
        border: 1px solid var(--dash-gold);
        background: rgba(244, 185, 66, .08);
        color: var(--dash-gold);
        letter-spacing: 1px;
      }
      @media (prefers-reduced-motion: reduce) {
        .side-panel, .gallery-tile, .side-toast { animation: none !important; transition: none !important; }
      }
      /* Landscape blocker: touch devices only — desktop landscape windows stay playable */
      #rotate-overlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10000;
        background: #17202A;
        color: #FFF3D6;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        text-align: center;
        font-family: 'Chakra Petch', 'Helvetica Neue', Arial, sans-serif;
      }
      #rotate-overlay .icon {
        font-size: 64px;
        animation: rotate-hint 1.8s ease-in-out infinite;
      }
      #rotate-overlay .title {
        font-family: 'Anton', 'Arial Black', Impact, sans-serif;
        font-size: 30px;
        letter-spacing: 2px;
        color: #F4B942;
      }
      #rotate-overlay .sub { font-size: 14px; opacity: 0.8; }
      @keyframes rotate-hint {
        0%, 25% { transform: rotate(0deg); }
        65%, 100% { transform: rotate(90deg); }
      }
      @media (orientation: landscape) and (pointer: coarse) {
        #rotate-overlay { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="app-shell">
      <div id="side-left" class="side-panel"></div>
      <div id="game"></div>
      <div id="side-right" class="side-panel"></div>
    </div>
    <div id="rotate-overlay">
      <div class="icon">📱</div>
      <div class="title">ROTATE YOUR DEVICE</div>
      <div class="sub">This game plays in portrait</div>
    </div>
    <!-- TEMP DEBUG: on-screen error reporter for mobile — remove after diagnosing -->
    <script>
      (function () {
        var box = null;
        function show(msg) {
          if (!box) {
            box = document.createElement('pre');
            box.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:rgba(120,0,0,.92);color:#fff;font:11px/1.4 monospace;padding:8px;margin:0;max-height:60%;overflow:auto;white-space:pre-wrap;pointer-events:none;';
            document.body.appendChild(box);
          }
          box.textContent += msg + '\n\n';
        }
        window.addEventListener('error', function (e) {
          show('ERROR: ' + e.message + '\n  at ' + (e.filename || '?') + ':' + e.lineno + ':' + e.colno + (e.error && e.error.stack ? '\n' + e.error.stack : ''));
        });
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason;
          show('UNHANDLED REJECTION: ' + (r && (r.stack || r.message) || String(r)));
        });
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
